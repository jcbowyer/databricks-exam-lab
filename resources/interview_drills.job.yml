# Interview drills: 15 must-know live-coding patterns, one notebook task each, chained 01 -> 15.
# Run setup_tpch first. No compute blocks, so every task runs on serverless.
resources:
  jobs:
    interview_drills:
      name: interview_drills
      tasks:
        - task_key: 01_read_explicit_schema_write_delta
          notebook_task:
            notebook_path: ../src/interview_drills/01_read_explicit_schema_write_delta.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        - task_key: 02_select_filter_withcolumn_cast_alias
          depends_on:
            - task_key: 01_read_explicit_schema_write_delta
