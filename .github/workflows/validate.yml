name: validate

on:
  push:
  pull_request:

jobs:
  unit-tests:
    # Pure-Python tests for src/common; no Databricks connection needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest -q tests

  bundle-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      # The `ci` target has no workspace.profile, so the CLI authenticates from these environment variables.
      - run: databricks bundle validate -t ci
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
