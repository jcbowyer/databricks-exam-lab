# Declarative Automation Bundle (formerly Databricks Asset Bundle) for the exam lab.
# Every job runs on serverless compute: no clusters, pools or node types are defined anywhere.
bundle:
  name: databricks-exam-lab

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog that holds the lab schema.
    default: workspace
  schema:
    description: Schema that the setup job copies TPC-H tables into.
    default: exam_lab

targets:
  # Local development against a Free Edition workspace.
  # Authenticate once with: databricks auth login --host <workspace-url> --profile free
  dev:
    mode: development
    default: true
    workspace:
      profile: free

  # CI target: no profile, so the CLI reads DATABRICKS_HOST / DATABRICKS_TOKEN from the environment.
  ci:
    mode: development
